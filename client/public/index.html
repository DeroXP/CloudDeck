<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CloudDeck</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#0a0e1a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/css/xmb.css" />
</head>
<body class="cd-input-mouse">

  <!-- Animated background: deep crimson gradient + layered translucent red
       ribbons + floating face-button glyphs + slow pulsing halo + vignette.
       Pure CSS / SVG, no JS. -->
  <div class="cd-bg">
    <!-- Pulsing halo behind everything for depth -->
    <div class="cd-bg-halo" aria-hidden="true"></div>

    <!-- Diagonal light sweep — obvious moving element so there's always
         something clearly in motion even if the waves blend together. -->
    <div class="cd-bg-sweep" aria-hidden="true"></div>

    <!-- Five wave ribbons in varying red tones, drifting independently -->
    <svg class="cd-bg-waves" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="cdw1" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#ff6680" stop-opacity="0"/>
          <stop offset="50%"  stop-color="#ff6680" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#ff6680" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="cdw2" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#ffb0c0" stop-opacity="0"/>
          <stop offset="50%"  stop-color="#ffb0c0" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#ffb0c0" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="cdw3" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#e63946" stop-opacity="0"/>
          <stop offset="50%"  stop-color="#e63946" stop-opacity="0.65"/>
          <stop offset="100%" stop-color="#e63946" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="cdw4" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#ff9080" stop-opacity="0"/>
          <stop offset="50%"  stop-color="#ff9080" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#ff9080" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="cdw5" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#c01838" stop-opacity="0"/>
          <stop offset="50%"  stop-color="#c01838" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#c01838" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <!-- Wave paths now ~120px thick instead of 20px so transforms actually
           translate visible mass around. SMIL animate on the d attribute
           morphs each ribbon's shape independently of the CSS transforms,
           creating real undulation (the curve itself bends) on top of the
           CSS-driven translate/scale. -->
      <path class="cd-wave cd-wave-a" fill="url(#cdw1)" d="M-100,420 C400,260 900,600 1400,420 C1700,320 1900,480 2100,420 L2100,540 C1900,600 1700,440 1400,540 C900,720 400,380 -100,540 Z">
        <animate attributeName="d" dur="8s" repeatCount="indefinite"
          values="M-100,420 C400,260 900,600 1400,420 C1700,320 1900,480 2100,420 L2100,540 C1900,600 1700,440 1400,540 C900,720 400,380 -100,540 Z;
                  M-100,500 C400,720 900,300 1400,520 C1700,640 1900,400 2100,500 L2100,620 C1900,520 1700,720 1400,620 C900,400 400,820 -100,620 Z;
                  M-100,420 C400,260 900,600 1400,420 C1700,320 1900,480 2100,420 L2100,540 C1900,600 1700,440 1400,540 C900,720 400,380 -100,540 Z"/>
      </path>
      <path class="cd-wave cd-wave-b" fill="url(#cdw2)" d="M-100,520 C500,720 1000,300 1500,520 C1750,620 1950,460 2100,520 L2100,640 C1950,580 1750,740 1500,640 C1000,420 500,840 -100,640 Z">
        <animate attributeName="d" dur="11s" repeatCount="indefinite"
          values="M-100,520 C500,720 1000,300 1500,520 C1750,620 1950,460 2100,520 L2100,640 C1950,580 1750,740 1500,640 C1000,420 500,840 -100,640 Z;
                  M-100,440 C500,260 1000,720 1500,440 C1750,300 1950,640 2100,440 L2100,560 C1950,640 1750,300 1500,560 C1000,840 500,260 -100,560 Z;
                  M-100,520 C500,720 1000,300 1500,520 C1750,620 1950,460 2100,520 L2100,640 C1950,580 1750,740 1500,640 C1000,420 500,840 -100,640 Z"/>
      </path>
      <path class="cd-wave cd-wave-c" fill="url(#cdw3)" d="M-100,460 C600,640 1100,320 1700,460 C1850,510 1950,420 2100,460 L2100,580 C1950,540 1850,630 1700,580 C1100,440 600,760 -100,580 Z">
        <animate attributeName="d" dur="14s" repeatCount="indefinite"
          values="M-100,460 C600,640 1100,320 1700,460 C1850,510 1950,420 2100,460 L2100,580 C1950,540 1850,630 1700,580 C1100,440 600,760 -100,580 Z;
                  M-100,560 C600,360 1100,720 1700,560 C1850,610 1950,520 2100,560 L2100,680 C1950,640 1850,730 1700,680 C1100,540 600,860 -100,680 Z;
                  M-100,460 C600,640 1100,320 1700,460 C1850,510 1950,420 2100,460 L2100,580 C1950,540 1850,630 1700,580 C1100,440 600,760 -100,580 Z"/>
      </path>
      <path class="cd-wave cd-wave-d" fill="url(#cdw4)" d="M-100,580 C350,400 850,720 1350,580 C1650,495 1850,660 2100,580 L2100,700 C1850,670 1650,515 1350,700 C850,840 350,520 -100,700 Z">
        <animate attributeName="d" dur="10s" repeatCount="indefinite"
          values="M-100,580 C350,400 850,720 1350,580 C1650,495 1850,660 2100,580 L2100,700 C1850,670 1650,515 1350,700 C850,840 350,520 -100,700 Z;
                  M-100,480 C350,720 850,360 1350,480 C1650,580 1850,400 2100,480 L2100,600 C1850,520 1650,720 1350,600 C850,400 350,820 -100,600 Z;
                  M-100,580 C350,400 850,720 1350,580 C1650,495 1850,660 2100,580 L2100,700 C1850,670 1650,515 1350,700 C850,840 350,520 -100,700 Z"/>
      </path>
      <path class="cd-wave cd-wave-e" fill="url(#cdw5)" d="M-100,400 C450,640 950,260 1450,400 C1700,490 1900,340 2100,400 L2100,520 C1900,460 1700,620 1450,520 C950,300 450,720 -100,520 Z">
        <animate attributeName="d" dur="13s" repeatCount="indefinite"
          values="M-100,400 C450,640 950,260 1450,400 C1700,490 1900,340 2100,400 L2100,520 C1900,460 1700,620 1450,520 C950,300 450,720 -100,520 Z;
                  M-100,500 C450,280 950,720 1450,500 C1700,400 1900,640 2100,500 L2100,620 C1900,580 1700,300 1450,620 C950,820 450,380 -100,620 Z;
                  M-100,400 C450,640 950,260 1450,400 C1700,490 1900,340 2100,400 L2100,520 C1900,460 1700,620 1450,520 C950,300 450,720 -100,520 Z"/>
      </path>
    </svg>

    <!-- Floating face-button glyphs were removed — felt busy alongside the
         ribbons, especially on smaller screens. -->

    <!-- Subtle vignette to anchor focus in the middle -->
    <div class="cd-bg-vignette" aria-hidden="true"></div>
  </div>

  <!-- Boot screen -->
  <div class="cd-boot" id="boot">
    <div class="cd-boot-logo">CLOUDDECK</div>
    <div class="cd-boot-sub">Connecting…</div>
  </div>

  <!-- Header chips -->
  <div class="cd-header">
    <div class="cd-brand">CLOUDDECK</div>
    <div class="cd-header-right">
      <div class="cd-chip" id="net-chip" title="Network quality">
        <span class="cd-chip-dot grey" id="net-dot"></span>
        <span id="net-text">—</span>
      </div>
      <div class="cd-chip" id="ping-chip" title="WebSocket round-trip latency">
        <span id="ping-text">—</span>
      </div>
      <div class="cd-power offline" id="power-btn" role="button" tabindex="0" title="Wake PC">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.36 6.64a9 9 0 11-12.72 0" />
          <line x1="12" y1="2" x2="12" y2="12" />
        </svg>
      </div>
    </div>
  </div>

  <!-- XMB main -->
  <main class="cd-xmb" id="xmb">

    <!-- Last-played shortcuts -->
    <div class="cd-shortcuts" id="shortcuts"></div>

    <!-- Categories -->
    <div class="cd-cats" id="cats">
      <div class="cd-cat" data-cat="games">
        <div class="cd-cat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="6" width="20" height="12" rx="3"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="16" cy="11" r="1"/><circle cx="18" cy="13" r="1"/>
          </svg>
        </div>
        <div class="cd-cat-label">Games</div>
      </div>
      <div class="cd-cat" data-cat="dashboard">
        <div class="cd-cat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1118 0"/><line x1="12" y1="12" x2="16" y2="8"/><circle cx="12" cy="12" r="1"/>
          </svg>
        </div>
        <div class="cd-cat-label">Dashboard</div>
      </div>
      <div class="cd-cat" data-cat="screenshots">
        <div class="cd-cat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </div>
        <div class="cd-cat-label">Screenshots</div>
      </div>
      <div class="cd-cat" data-cat="settings">
        <div class="cd-cat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008.91 19a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 005 14.91a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 005 8.91a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 008.91 5a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09A1.65 1.65 0 0014.91 5a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019 8.91c.32.78 1.07 1.31 1.91 1.31H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
        </div>
        <div class="cd-cat-label">Settings</div>
      </div>
    </div>

    <!-- Items panel (filled by JS depending on active category) -->
    <div class="cd-items">
      <div class="cd-items-content" id="items">
        <div style="text-align:center; color: var(--cd-fg-dim); padding: 60px;">
          PC offline. Press power to wake.
        </div>
      </div>
    </div>
  </main>

  <!-- Mobile bottom-tab navigation. Hidden on desktop via CSS, shown only on
       mobile viewports where it replaces the desktop XMB horizontal row.
       Each button calls xmb.setActive(index) via a JS click handler. -->
  <nav class="cd-mobile-nav" id="mobile-nav" aria-label="Categories">
    <button class="cd-mobile-tab" data-cat="0" type="button">
      <svg class="cd-mobile-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="6" width="20" height="12" rx="3"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="16" cy="11" r="1"/><circle cx="18" cy="13" r="1"/>
      </svg>
      <span class="cd-mobile-tab-label">Games</span>
    </button>
    <button class="cd-mobile-tab" data-cat="1" type="button">
      <svg class="cd-mobile-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 1118 0"/><line x1="12" y1="12" x2="16" y2="8"/><circle cx="12" cy="12" r="1"/>
      </svg>
      <span class="cd-mobile-tab-label">Stats</span>
    </button>
    <button class="cd-mobile-tab" data-cat="2" type="button">
      <svg class="cd-mobile-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3"/>
      </svg>
      <span class="cd-mobile-tab-label">Photos</span>
    </button>
    <button class="cd-mobile-tab" data-cat="3" type="button">
      <svg class="cd-mobile-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008.91 19a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 005 14.91a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 005 8.91a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 008.91 5a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09A1.65 1.65 0 0014.91 5a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019 8.91c.32.78 1.07 1.31 1.91 1.31H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
      <span class="cd-mobile-tab-label">Settings</span>
    </button>
  </nav>

  <!-- Stream — everything in here stays visible when the browser is in
       fullscreen, because :fullscreen hides every element except the one we
       called requestFullscreen() on and its descendants. -->
  <div class="cd-stream" id="stream">
    <iframe id="stream-frame" allow="autoplay; fullscreen; gamepad; microphone *; clipboard-read; clipboard-write" allowfullscreen></iframe>
    <div class="cd-stream-freeze cd-hidden" id="freeze"></div>

    <button class="cd-overlay-btn cd-hidden" id="overlay-btn">⠿ Library</button>
    <button class="cd-overlay-btn cd-overlay-btn-fs cd-hidden" id="fullscreen-btn">⤢ Fullscreen</button>
    <button class="cd-overlay-btn cd-overlay-btn-exit cd-hidden" id="exit-stream-btn">× Exit Stream</button>

    <div class="cd-overlay" id="overlay">
      <div class="cd-overlay-inner">
        <h2 style="margin-top:0; letter-spacing: 4px;">Library</h2>
        <div class="cd-games" id="overlay-games"></div>
      </div>
    </div>
  </div>

  <!-- Game detail overlay -->
  <div class="cd-detail" id="game-detail">
    <button class="cd-detail-close" id="game-detail-close" title="Back (Esc)">←  Back</button>
    <div class="cd-detail-scroll" id="game-detail-body"></div>
  </div>

  <!-- AFK overlay -->
  <div class="cd-afk" id="afk">
    <div class="cd-afk-title">No Activity Detected</div>
    <div class="cd-afk-msg">Session will end and PC will sleep in</div>
    <div class="cd-afk-timer" id="afk-timer">5:00</div>
    <button class="cd-afk-btn" id="afk-dismiss">I'M HERE</button>
  </div>

  <!-- Reconnecting -->
  <div class="cd-reconnect" id="reconnect">
    <div class="cd-reconnect-inner">
      <div class="cd-reconnect-spinner"></div>
      <div style="letter-spacing: 3px; font-size: 12px;">RECONNECTING…</div>
    </div>
  </div>

  <!-- Toasts -->
  <div class="cd-toasts" id="toasts"></div>

  <!-- Mobile gamepad -->
  <div class="cd-mobile-pad" id="mobile-pad">
    <div class="cd-pad-shoulders">
      <div>
        <div class="cd-pad-shoulder" data-btn="lb">LB</div>
        <div class="cd-pad-shoulder" data-btn="lt">LT</div>
      </div>
      <div>
        <div class="cd-pad-shoulder" data-btn="rt">RT</div>
        <div class="cd-pad-shoulder" data-btn="rb">RB</div>
      </div>
    </div>
    <div class="cd-pad-zone cd-pad-left" id="pad-left"></div>
    <div class="cd-pad-zone cd-pad-right">
      <div class="cd-pad-btn cd-pad-y" data-btn="y">Y</div>
      <div class="cd-pad-btn cd-pad-x" data-btn="x">X</div>
      <div class="cd-pad-btn cd-pad-b" data-btn="b">B</div>
      <div class="cd-pad-btn cd-pad-a" data-btn="a">A</div>
    </div>
  </div>

  <!-- Hints bar -->
  <div class="cd-hints" id="hints">
    <span class="cd-hint cd-hint-key"><span class="cd-hint-key">←/→</span> Navigate</span>
    <span class="cd-hint cd-hint-key"><span class="cd-hint-key">Enter</span> Confirm</span>
    <span class="cd-hint cd-hint-key"><span class="cd-hint-key">Esc</span> Back</span>
    <span class="cd-hint cd-hint-controller">A Confirm · B Back · LB/RB Switch Category</span>
  </div>

  <!-- Allow loading Steam Storefront API + CDN images directly from the
       browser for the game-detail modal — store.steampowered.com is CORS-open
       so the fetch works without proxying through our server. -->
  <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.2/dist/nipplejs.min.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
